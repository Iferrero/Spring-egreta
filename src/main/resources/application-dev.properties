# ── Perfil local (desarrollo) ─────────────────────────────────────────────────
# Actívalo con: -Dspring.profiles.active=dev  (o en Run Configuration de VS Code)
# Con este perfil se usa Basic Auth en lugar de CAS.

cas.enabled=false

# API Key for local/external REST endpoint authentication
app.api.key=9971c3cc-b3e0-48e3-9ff9-e990c795e92f

# Credenciales Basic Auth para desarrollo (igual que antes)
dev.user.name=recerca
