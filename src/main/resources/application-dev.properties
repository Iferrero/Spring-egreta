app.ai.country-suggest.enabled=true
app.ai.country-suggest.url=http://ymir.uab.cat:8007/v1/chat/completions
app.ai.country-suggest.model=openai/gpt-oss-20b
app.ai.country-suggest.api-key=agentYmir_SecureSecret2026
app.ai.country-suggest.timeout-ms=60000



