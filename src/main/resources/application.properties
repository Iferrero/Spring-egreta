# CAS SSO — UAB
cas.server.url-prefix=https://sso.uab.cat
cas.service.server-name=http://localhost:8080
cas.enabled=false

# API Key for local/external REST endpoint authentication
app.api.key=9971c3cc-b3e0-48e3-9ff9-e990c795e92f

# Legacy endpoint compatibility switch
app.api.legacy-endpoints-enabled=false

server.port=8080

# Multipart and request size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-form-post-size=50MB

# Sync de canvis de tipus d'organitzacions externes cap a Egreta
app.egreta.external-org.enabled=true
# Base de la mateixa API utilitzada pels scripts de sincronitzacio
app.egreta.external-org.base-url=https://egreta.uab.cat/ws/api/external-organizations
# Exemples:
# app.egreta.external-org.get-url-template=https://egreta.uab.cat/ws/api/external-organizations/{uuid}
# app.egreta.external-org.put-url-template=https://egreta.uab.cat/ws/api/external-organizations/{uuid}
app.egreta.external-org.get-url-template=
app.egreta.external-org.put-url-template=
app.egreta.external-org.api-key=9971c3cc-b3e0-48e3-9ff9-e990c795e92f
app.egreta.external-org.timeout-ms=12000

# API antiga (54) per endpoints que encara no estan migrats
egreta54.base.url=https://egretat.uab.cat/ws/api/524
egreta54.api.key=a1d0f3bf-746c-40bb-9805-aa53d426ce35

# WebClient/Reactor Netty hardening for remote HTTPS APIs (Egreta)
app.webclient.connect-timeout-ms=5000
app.webclient.response-timeout-ms=12000
app.webclient.read-timeout-seconds=15
app.webclient.write-timeout-seconds=15
app.webclient.pool.max-connections=100
app.webclient.pool.max-idle-seconds=20

# Avoid noisy WARN logs when remote peers close idle pooled connections
logging.level.reactor.netty.channel.ChannelOperationsHandler=ERROR

# Scopus API Key (Elsevier)
app.scopus.api-key=

# ROR (Research Organization Registry) Database / Collection Integration (MongoDB)
app.ror.suggest.enabled=true
app.ror.mongodb.database=Ror
app.ror.mongodb.collection=ror_data
app.ror.suggest.url=https://api.ror.org/v2/organizations
app.ror.suggest.timeout-ms=3500


# OpenAlex Author API Integration
app.openalex.author-suggest.enabled=true
app.openalex.author-suggest.url=https://api.openalex.org/authors
app.openalex.author-suggest.timeout-ms=3500
app.openalex.api-key=nlv4tuU0Dpv4sGPsVku3m3

# Crossref API Integration
app.crossref.suggest.enabled=true
app.crossref.suggest.url=https://api.crossref.org/works
app.crossref.suggest.timeout-ms=3500
app.crossref.mailto=egreta@uab.cat


# vLLM Local Server Integration for AI Affiliation Parsing (OpenAI API compatible)
app.vllm.enabled=true
app.vllm.url=https://ymir.uab.cat:8014/v1/chat/completions
app.vllm.model=openai/gpt-oss-20b
app.vllm.api-key=
app.vllm.timeout-ms=25000


