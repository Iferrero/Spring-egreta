<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración Egreta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            min-height: 100vh;
        }
        body.loading .container {
            display: none;
        }
        .startup-loading {
            min-height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            color: #1976d2;
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        body.loading .startup-loading {
            display: flex;
        }
        .container {
            background: #fff;
            padding: 2.5em 2em 2em 2em;
            border-radius: 18px;
            box-shadow: 0 6px 32px #bdbdbd44;
            max-width: 520px;
            margin: 48px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 0.5em;
            font-weight: 700;
            color: #1976d2;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 1.5em;
        }
        .sync-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.7em 1em;
            width: 100%;
            margin-bottom: 1.5em;
        }
        .sync-btn {
            padding: 0.7em 0.5em;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            background: #1976d2;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 2px 8px #1976d233;
            transition: background 0.2s, transform 0.1s;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
        }
        .sync-btn-meta {
            margin-top: 0.2em;
            font-size: 0.78em;
            font-weight: 400;
            opacity: 0.95;
        }
        .sync-btn:disabled {
            background: #bdbdbd;
            color: #eee;
            cursor: not-allowed;
            transform: none;
        }
        .sync-btn:hover:not(:disabled) {
            background: #1565c0;
            transform: translateY(-2px) scale(1.03);
        }
        .status {
            margin-top: 0.5em;
            font-size: 1.1em;
            min-height: 1.5em;
            text-align: center;
        }
        .status.error {
            color: #d32f2f;
            font-weight: bold;
        }
        .status.ok {
            color: #388e3c;
            font-weight: bold;
        }
        .progress-outer {
            margin-top: 1.5em;
            width: 100%;
            background: #e3e3e3;
            border-radius: 8px;
            overflow: hidden;
            height: 28px;
            box-shadow: 0 2px 8px #1976d211;
            display: none;
        }
        .progress-inner {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #1976d2 60%, #64b5f6 100%);
            color: #fff;
            text-align: center;
            line-height: 28px;
            font-size: 1.05em;
            font-weight: 500;
            transition: width 0.3s, background 0.3s;
        }
        @media (max-width: 600px) {
            .container {
                max-width: 98vw;
                padding: 1em 0.2em 1.5em 0.2em;
            }
            .sync-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="loading">
<div id="startupLoading" class="startup-loading">Carregant dades...</div>
<div class="container">
    <h1>Administració Mongo Egreta</h1>
    <div class="subtitle">Sincronitza i monitoritza l'estat de cada col·lecció</div>
    <div class="sync-grid">
        <button id="syncBtn" class="sync-btn">Activities</button>

    function renderButtonStats(button, mongoCount, collectionCount) {
        if (!button.dataset.baseLabel) {
            button.dataset.baseLabel = button.textContent.trim();
        }
        const mongo = Number.isFinite(mongoCount) ? mongoCount : 0;
        const collection = Number.isFinite(collectionCount) ? collectionCount : 0;
        button.innerHTML = `${button.dataset.baseLabel}<span class="sync-btn-meta">Mongo: ${mongo} / Egreta: ${collection}</span>`;
    }

    async function loadCollectionStats() {
        try {
            const res = await fetch('/egreta/sync/stats');
            if (!res.ok) {
                return false;
            }
            const stats = await res.json();
            buttonStatsMap.forEach(({ button, collection }) => {
                const values = stats?.[collection] || {};
                renderButtonStats(button, values.mongo, values.collection);
            });
            return true;
        } catch (e) {
            // Silent fail: los botones siguen operativos aunque no carguen estadísticas.
            return false;
        }
    }

    async function bootstrapPage() {
        let statsLoaded = false;
        while (!statsLoaded) {
            statsLoaded = await loadCollectionStats();
            if (!statsLoaded) {
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
        }
        document.body.classList.remove('loading');
    }

    bootstrapPage();

    function setStatus(text, type) {
        status.textContent = text;
        status.className = 'status' + (type ? ' ' + type : '');
    }

    function pollProgress(collection, onFinish) {
        progressBar.style.display = 'block';
        progressFill.style.width = '0%';
        progressFill.style.background = '#1976d2';
        progressFill.textContent = 'Iniciando...';

        setTimeout(() => {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/egreta/sync/progress/${collection}`);
                    if (!res.ok) {
                        setStatus('Error al consultar el progreso.', 'error');
                        progressFill.style.background = '#d32f2f';
                        progressFill.style.width = '100%';
                        progressFill.textContent = 'Error';
                        clearInterval(interval);
                        setTimeout(() => {
                            progressBar.style.display = 'none';
                            if (onFinish) onFinish();
                        }, 5000);
                        return;
                    }
                    const data = await res.json();

                    if (data && data.error) {
                        progressFill.style.background = '#d32f2f';
                        progressFill.style.width = '100%';
                        progressFill.textContent = 'Error';
                        setStatus(data.error, 'error');
                        clearInterval(interval);
                        setTimeout(() => {
                            progressBar.style.display = 'none';
                            if (onFinish) onFinish();
                        }, 5000);
                        return;
                    }

                    if (data && data.total > 0) {
                        if (data.completed) {
                            // Completado: barra en verde al 100%
                            progressFill.style.background = '#388e3c';
                            progressFill.style.width = '100%';
                            progressFill.textContent = `100% (${data.total}/${data.total})`;
                            setStatus(`Sincronització completada (${data.total} registros).`, 'ok');
                            clearInterval(interval);
                            setTimeout(() => {
                                progressBar.style.display = 'none';
                                loadCollectionStats();
                                if (onFinish) onFinish();
                            }, 2000);
                        } else {
                            // En progreso: máximo 99% hasta confirmar completed
                            const percent = Math.min(99, Math.round(100 * data.current / data.total));
                            progressFill.style.width = percent + '%';
                            progressFill.textContent = `${percent}% (${data.current}/${data.total})`;
                        }
                    }
                } catch (e) {
                    setStatus('Error de red o de formato en la respuesta.', 'error');
                    progressFill.style.background = '#d32f2f';
                    progressFill.style.width = '100%';
                    progressFill.textContent = 'Error';
                    clearInterval(interval);
                    setTimeout(() => {
                        progressBar.style.display = 'none';
                        if (onFinish) onFinish();
                    }, 5000);
                }
            }, 1000);
        }, 500);
    }
