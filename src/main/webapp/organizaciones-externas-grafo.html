<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Similitud d'Organitzacions Externes</title>
    <script src="config.js"></script>
    <script src="uab-brand.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="uab-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .control-panel {
            background-color: white;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            margin-bottom: 16px;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .slider-group label {
            min-width: 120px;
            font-weight: 500;
            font-size: 14px;
        }
        .slider-group input[type="range"] {
            flex: 1;
        }
        .slider-value {
            min-width: 50px;
            text-align: right;
            font-weight: 600;
            color: #4CAF50;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-card.primary {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
        }
        .stat-card.secondary {
            background: linear-gradient(135deg, #2196F3 0%, #1565C0 100%);
        }
        .stat-card.tertiary {
            background: linear-gradient(135deg, #FF9800 0%, #E65100 100%);
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
        }
        .legend {
            display: flex;
            gap: 20px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        .legend-box.with-type {
            background-color: #4CAF50;
        }
        .legend-box.without-type {
            background-color: #ccc;
        }
        .view-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .view-tab-btn {
            border: 1px solid #cbd5e1;
            background: white;
            color: #334155;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }
        .view-tab-btn.active {
            background: #0f172a;
            color: white;
            border-color: #0f172a;
        }
        .view-hidden {
            display: none;
        }
        .table-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .table-toolbar input {
            width: 320px;
            max-width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
        }
        .table-wrap {
            max-height: 600px;
            overflow: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
        }
        table.fast-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;

        .fast-table th,
        .fast-table td {
            border-bottom: 1px solid #f1f5f9;
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
        }
        .fast-table th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #f8fafc;
            color: #334155;
            font-weight: 700;
        }
        .sim-chip {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            background: #e0f2fe;
            color: #0c4a6e;
            font-weight: 700;
            font-size: 12px;
        }
        .cluster-list {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            max-height: 600px;
            overflow: auto;
            padding: 8px;
        }
        .cluster-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            background: #ffffff;
        }
        .cluster-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .cluster-badge {
            font-size: 12px;
            font-weight: 700;
            background: #dcfce7;
            color: #14532d;
            border-radius: 999px;
            padding: 2px 8px;
        }
        .cluster-items {
            color: #475569;
            font-size: 13px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 6px 10px;
        }
        .pager {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
            color: #475569;
            font-size: 12px;
        }
        .pager-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pager-btn {
            border: 1px solid #cbd5e1;
            background: white;
            color: #334155;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 600;
        }
        .pager-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .results-wrap {
            position: relative;
        }
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(248, 250, 252, 0.78);
            -webkit-backdrop-filter: blur(1px);
            backdrop-filter: blur(1px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            border-radius: 8px;
        }
        .loading-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: white;
            color: #0f172a;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
        }
        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            border-top-color: #2563eb;
            border-radius: 999px;
            animation: spin 0.8s linear infinite;
        }
        .hidden {
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
<div class="mx-auto max-w-7xl px-4 py-10">
    <header class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5 mb-8">
        <a href="index-orgaext.html" class="hover:opacity-80 transition-opacity">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Similitud d'Organitzacions</h1>
                <p class="text-sm text-slate-500 mt-1">Detecció ràpida de noms similars amb taula i clusters</p>
            </div>
        </a>
        <div class="flex gap-3">
            <a href="organizaciones-externas.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-sm text-slate-600 shadow-sm">
                <i class="fa-solid fa-list"></i> Llistat complet
            </a>
            <a href="organizaciones-externas-kpis.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-sm text-slate-600 shadow-sm">
                <i class="fa-solid fa-chart-column"></i> KPIs
            </a>
        </div>
    </header>

    <div class="control-panel">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card primary">
                <div class="stat-value" id="totalOrgsValue">0</div>
                <div class="stat-label">Organitzacions</div>
            </div>
            <div class="stat-card secondary">
                <div class="stat-value" id="totalNodesValue">0</div>
                <div class="stat-label">Noms en mostra</div>
            </div>
            <div class="stat-card tertiary">
                <div class="stat-value" id="totalEdgesValue">0</div>
                <div class="stat-label">Arestes (Similars)</div>
            </div>
        </div>

        <div class="slider-group">
            <label for="similaritySlider">Llindar similitud:</label>
            <input type="range" id="similaritySlider" min="0.8" max="1.0" step="0.05" value="0.9">
            <span class="slider-value" id="similarityValue">90%</span>
        </div>

        <div class="flex gap-3 mb-3">
            <button id="btnReload" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition-colors">
                <i class="fa-solid fa-rotate"></i> Recarregar
            </button>
            <button id="btnCenter" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm font-medium transition-colors">
                <i class="fa-solid fa-expand"></i> Centrar
            </button>
            <button id="btnExport" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm font-medium transition-colors">
                <i class="fa-solid fa-download"></i> Descarregar
            </button>
        </div>

        <div class="view-tabs">
            <button id="modeTable" class="view-tab-btn active"><i class="fa-solid fa-table"></i> Taula ràpida</button>
            <button id="modeClusters" class="view-tab-btn"><i class="fa-solid fa-layer-group"></i> Clusters</button>
        </div>

        <div class="table-toolbar">
            <input id="searchInput" type="text" placeholder="Filtra per nom (ex. institute, universidad, hospital...)" />
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-box with-type"></div>
                <span>Amb tipus</span>
            </div>
            <div class="legend-item">
                <div class="legend-box without-type"></div>
                <span>Sense tipus</span>
            </div>
        </div>
    </div>

    <div class="results-wrap">
        <div id="loadingOverlay" class="loading-overlay hidden" aria-live="polite" aria-busy="false">
            <div class="loading-card">
                <span class="loading-spinner" aria-hidden="true"></span>
                <span id="loadingText">Calculant similitud...</span>
            </div>
        </div>
        <div id="tableContainer" class="table-wrap"></div>
        <div id="clustersContainer" class="cluster-list view-hidden"></div>
    </div>
</div>

<script>
let currentData = null;
let currentPairs = [];
let currentClusters = [];
let currentMode = 'table';
let pendingRequests = 0;
let tablePage = 1;
let clustersPage = 1;
let activeRequestId = 0;
const queryCache = new Map();
const graphLimit = 70000;
const maxPairs = 5000;
const tablePageSize = 100;
const clustersPageSize = 40;
const queryCacheTtlMs = 2 * 60 * 1000;
const queryCacheMaxEntries = 20;

function debounce(fn, delayMs) {
    let timeoutId = null;
    return (...args) => {
        if (timeoutId) {
            clearTimeout(timeoutId);
        }
        timeoutId = setTimeout(() => fn(...args), delayMs);
    };
}

function normalizeText(value) {
    return String(value || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
}

function safeHtml(value) {
    return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function formatNameWithPureId(name, pureId) {
    const base = String(name || '').trim();
    const pid = String(pureId || '').trim();
    if (!pid) {
        return base;
    }
    return base + ' (' + pid + ')';
}

function setLoading(isLoading, message) {
    const overlay = document.getElementById('loadingOverlay');
    const text = document.getElementById('loadingText');
    if (!overlay || !text) return;

    if (message) {
        text.textContent = message;
    }

    overlay.classList.toggle('hidden', !isLoading);
    overlay.setAttribute('aria-busy', isLoading ? 'true' : 'false');
}

function hideLoadingOverlayWithDone() {
    setLoading(true, 'Calculant similitud... 100%');
    setTimeout(() => {
        if (pendingRequests === 0) {
            setLoading(false);
        }
    }, 120);
}

function makeQueryCacheKey(similarity) {
    return similarity.toFixed(3) + '|' + graphLimit + '|' + maxPairs;
}

function getCachedQueryResult(key) {
    const entry = queryCache.get(key);
    if (!entry) {
        return null;
    }

    const now = Date.now();
    if ((now - entry.timestamp) > queryCacheTtlMs) {
        queryCache.delete(key);
        return null;
    }

    return entry.payload;
}

function setCachedQueryResult(key, payload) {
    queryCache.set(key, {
        timestamp: Date.now(),
        payload
    });

    if (queryCache.size > queryCacheMaxEntries) {
        const oldestKey = queryCache.keys().next().value;
        if (oldestKey) {
            queryCache.delete(oldestKey);
        }
    }
}

async function fetchSimilarityWithRealProgress(similarity, requestId) {
    const startRes = await fetch('/api/external-organizations/similarity/pairs/job/start?threshold=' + similarity + '&limit=' + graphLimit + '&maxPairs=' + maxPairs);
    if (!startRes.ok) throw new Error('HTTP ' + startRes.status + ' iniciant job');
    const startData = await startRes.json();
    const jobId = startData.jobId;
    if (!jobId) {
        throw new Error('No s\'ha rebut jobId');
    }

    let guard = 0;
    while (guard < 1200) {
        guard += 1;

        if (requestId !== activeRequestId) {
            return null;
        }

        const statusRes = await fetch('/api/external-organizations/similarity/pairs/job/status?jobId=' + encodeURIComponent(jobId));
        if (!statusRes.ok) throw new Error('HTTP ' + statusRes.status + ' consultant progrés');
        const status = await statusRes.json();

        const progress = typeof status.progress === 'number' ? Math.max(0, Math.min(100, Math.round(status.progress))) : 0;
        setLoading(true, 'Calculant similitud... ' + progress + '%');

        if (status.status === 'done') {
            return status.result || null;
        }

        if (status.status === 'error' || status.status === 'not-found') {
            throw new Error(status.error || status.message || 'Error al calcular similitud');
        }

        await new Promise(resolve => setTimeout(resolve, 250));
    }

    throw new Error('Temps d\'espera esgotat al calcular la similitud');
}

function buildPairs() {
    if (!currentData || !Array.isArray(currentData.pairs)) {
        currentPairs = [];
        return;
    }

    currentPairs = currentData.pairs
        .map(p => ({
            from: p.from,
            to: p.to,
            similarity: p.value,
            leftLabel: formatNameWithPureId(p.leftLabel || String(p.from), p.leftPureId),
            rightLabel: formatNameWithPureId(p.rightLabel || String(p.to), p.rightPureId),
            leftTitle: p.leftLabel || '',
            rightTitle: p.rightLabel || '',
            rawTitle: p.title || ''
        }))
        .sort((a, b) => b.similarity - a.similarity);
}

function buildClusters() {
    if (!currentData || !Array.isArray(currentData.pairs)) {
        currentClusters = [];
        return;
    }

    const idToLabel = new Map();
    for (const p of currentData.pairs) {
        idToLabel.set(p.from, formatNameWithPureId(p.leftLabel || String(p.from), p.leftPureId));
        idToLabel.set(p.to, formatNameWithPureId(p.rightLabel || String(p.to), p.rightPureId));
    }

    const parent = new Map(Array.from(idToLabel.keys()).map(id => [id, id]));

    const find = (x) => {
        let p = parent.get(x);
        while (p !== parent.get(p)) {
            parent.set(p, parent.get(parent.get(p)));
            p = parent.get(p);
        }
        return p;
    };

    const union = (a, b) => {
        const pa = find(a);
        const pb = find(b);
        if (pa !== pb) {
            parent.set(pa, pb);
        }
    };

    currentData.pairs.forEach(p => union(p.from, p.to));

    const groups = new Map();
    for (const id of idToLabel.keys()) {
        const root = find(id);
        if (!groups.has(root)) {
            groups.set(root, []);
        }
        groups.get(root).push(id);
    }

    currentClusters = Array.from(groups.values())
        .filter(g => g.length > 1)
        .map(g => ({
            size: g.length,
            names: g.map(id => idToLabel.get(id) || String(id)).sort((a, b) => a.localeCompare(b))
        }))
        .sort((a, b) => b.size - a.size || a.names[0].localeCompare(b.names[0]));
}

function updateStats() {
    if (!currentData) return;
    const totalAvailable = typeof currentData.totalAvailableOrgs === 'number' ? currentData.totalAvailableOrgs : 0;
    const totalProcessed = typeof currentData.totalProcessedOrgs === 'number' ? currentData.totalProcessedOrgs : 0;
    const connected = typeof currentData.totalConnectedOrgs === 'number' ? currentData.totalConnectedOrgs : 0;
    const totalPairs = typeof currentData.totalPairs === 'number' ? currentData.totalPairs : 0;

    document.getElementById('totalOrgsValue').textContent = totalProcessed + '/' + totalAvailable;
    document.getElementById('totalNodesValue').textContent = connected;
    document.getElementById('totalEdgesValue').textContent = totalPairs;
}

function renderTable() {
    const container = document.getElementById('tableContainer');
    const q = normalizeText(document.getElementById('searchInput').value);

    const filtered = currentPairs.filter(p => {
        if (!q) return true;
        return normalizeText(p.leftLabel).includes(q)
            || normalizeText(p.rightLabel).includes(q)
            || normalizeText(p.leftTitle).includes(q)
            || normalizeText(p.rightTitle).includes(q)
            || normalizeText(p.rawTitle).includes(q);
    });

    const totalPages = Math.max(1, Math.ceil(filtered.length / tablePageSize));
    if (tablePage > totalPages) {
        tablePage = totalPages;
    }
    const start = (tablePage - 1) * tablePageSize;
    const end = start + tablePageSize;
    const visible = filtered.slice(start, end);

    if (!visible.length) {
        container.innerHTML = '<div class="p-6 text-slate-500">No hi ha parelles similars per al filtre actual.</div>';
        return;
    }

    const rows = visible.map(p => {
        const sim = Math.round(p.similarity * 100);
        return '<tr>'
            + '<td>' + safeHtml(p.leftLabel) + '</td>'
            + '<td>' + safeHtml(p.rightLabel) + '</td>'
            + '<td><span class="sim-chip">' + sim + '%</span></td>'
            + '</tr>';
    }).join('');

    const fromLabel = filtered.length === 0 ? 0 : (start + 1);
    const toLabel = Math.min(end, filtered.length);
    const note = '<div class="p-3 text-xs text-slate-500 border-b border-slate-100">Mostrant ' + fromLabel + '-' + toLabel + ' de ' + filtered.length + ' parelles.</div>';

    const pager = '<div class="pager">'
        + '<div>Pàgina ' + tablePage + ' de ' + totalPages + '</div>'
        + '<div class="pager-controls">'
        + '<button id="tablePrevPage" class="pager-btn"' + (tablePage <= 1 ? ' disabled' : '') + '>Anterior</button>'
        + '<button id="tableNextPage" class="pager-btn"' + (tablePage >= totalPages ? ' disabled' : '') + '>Següent</button>'
        + '</div>'
        + '</div>';

    container.innerHTML = note
        + '<table class="fast-table">'
        + '<thead><tr><th>Nom A</th><th>Nom B</th><th>Similitud</th></tr></thead>'
        + '<tbody>' + rows + '</tbody>'
        + '</table>'
        + pager;

    const prevBtn = document.getElementById('tablePrevPage');
    const nextBtn = document.getElementById('tableNextPage');
    if (prevBtn) {
        prevBtn.addEventListener('click', () => {
            if (tablePage > 1) {
                tablePage -= 1;
                renderTable();
            }
        });
    }
    if (nextBtn) {
        nextBtn.addEventListener('click', () => {
            if (tablePage < totalPages) {
                tablePage += 1;
                renderTable();
            }
        });
    }
}

function renderClusters() {
    const container = document.getElementById('clustersContainer');
    const q = normalizeText(document.getElementById('searchInput').value);

    const filtered = currentClusters.filter(c => {
        if (!q) return true;
        return c.names.some(name => normalizeText(name).includes(q));
    });

    const totalPages = Math.max(1, Math.ceil(filtered.length / clustersPageSize));
    if (clustersPage > totalPages) {
        clustersPage = totalPages;
    }
    const start = (clustersPage - 1) * clustersPageSize;
    const end = start + clustersPageSize;
    const visible = filtered.slice(start, end);

    if (!visible.length) {
        container.innerHTML = '<div class="p-4 text-slate-500">No hi ha clusters per al filtre actual.</div>';
        return;
    }

    const html = visible.map(c => {
        const preview = c.names.slice(0, 12).map(name => '<div>' + safeHtml(name) + '</div>').join('');
        const extra = c.names.length > 12 ? '<div class="text-slate-400">... +' + (c.names.length - 12) + ' més</div>' : '';
        return '<div class="cluster-card">'
            + '<div class="cluster-title">'
            + '<div class="font-semibold text-slate-700">' + safeHtml(c.names[0]) + '</div>'
            + '<span class="cluster-badge">' + c.size + ' noms</span>'
            + '</div>'
            + '<div class="cluster-items">' + preview + extra + '</div>'
            + '</div>';
    }).join('');

    const fromLabel = filtered.length === 0 ? 0 : (start + 1);
    const toLabel = Math.min(end, filtered.length);
    const note = '<div class="p-2 text-xs text-slate-500">Mostrant ' + fromLabel + '-' + toLabel + ' de ' + filtered.length + ' clusters.</div>';

    const pager = '<div class="pager">'
        + '<div>Pàgina ' + clustersPage + ' de ' + totalPages + '</div>'
        + '<div class="pager-controls">'
        + '<button id="clustersPrevPage" class="pager-btn"' + (clustersPage <= 1 ? ' disabled' : '') + '>Anterior</button>'
        + '<button id="clustersNextPage" class="pager-btn"' + (clustersPage >= totalPages ? ' disabled' : '') + '>Següent</button>'
        + '</div>'
        + '</div>';

    container.innerHTML = note + html + pager;

    const prevBtn = document.getElementById('clustersPrevPage');
    const nextBtn = document.getElementById('clustersNextPage');
    if (prevBtn) {
        prevBtn.addEventListener('click', () => {
            if (clustersPage > 1) {
                clustersPage -= 1;
                renderClusters();
            }
        });
    }
    if (nextBtn) {
        nextBtn.addEventListener('click', () => {
            if (clustersPage < totalPages) {
                clustersPage += 1;
                renderClusters();
            }
        });
    }
}

function setMode(mode) {
    currentMode = mode;

    document.getElementById('modeTable').classList.toggle('active', mode === 'table');
    document.getElementById('modeClusters').classList.toggle('active', mode === 'clusters');

    document.getElementById('tableContainer').classList.toggle('view-hidden', mode !== 'table');
    document.getElementById('clustersContainer').classList.toggle('view-hidden', mode !== 'clusters');

    if (mode === 'table') {
        renderTable();
    } else if (mode === 'clusters') {
        renderClusters();
    }
}

async function loadGraph() {
    const requestId = ++activeRequestId;
    const similarity = parseFloat(document.getElementById('similaritySlider').value);
    const cacheKey = makeQueryCacheKey(similarity);
    const cached = getCachedQueryResult(cacheKey);

    if (cached) {
        currentData = cached;
        updateStats();
        buildPairs();
        buildClusters();

        if (currentMode === 'table') {
            renderTable();
        } else {
            renderClusters();
        }

        setLoading(true, 'Resultat en caché... 100%');
        setTimeout(() => setLoading(false), 100);
        return;
    }

    pendingRequests += 1;
    setLoading(true, 'Calculant similitud... 1%');

    try {
        const data = await fetchSimilarityWithRealProgress(similarity, requestId);
        if (requestId !== activeRequestId || !data) {
            return;
        }
        currentData = data;
        setCachedQueryResult(cacheKey, data);

        updateStats();
        buildPairs();
        buildClusters();

        if (currentMode === 'table') {
            renderTable();
        } else {
            renderClusters();
        }
    } catch (e) {
        if (requestId !== activeRequestId) {
            return;
        }
        console.error('Error carregant dades:', e);
        const msg = '<div class="p-6 text-red-600"><i class="fa-solid fa-exclamation-circle mr-2"></i> Error carregant dades</div>';
        document.getElementById('tableContainer').innerHTML = msg;
        document.getElementById('clustersContainer').innerHTML = msg;
    } finally {
        pendingRequests = Math.max(0, pendingRequests - 1);
        if (pendingRequests === 0) {
            hideLoadingOverlayWithDone();
        }
    }
}

const debouncedLoadGraph = debounce(loadGraph, 280);

document.getElementById('similaritySlider').addEventListener('input', (e) => {
    document.getElementById('similarityValue').textContent = Math.round(e.target.value * 100) + '%';
    debouncedLoadGraph();
});

document.getElementById('btnReload').addEventListener('click', loadGraph);

document.getElementById('modeTable').addEventListener('click', () => setMode('table'));
document.getElementById('modeClusters').addEventListener('click', () => setMode('clusters'));
document.getElementById('searchInput').addEventListener('input', () => {
    tablePage = 1;
    clustersPage = 1;
    if (currentMode === 'table') {
        renderTable();
    } else if (currentMode === 'clusters') {
        renderClusters();
    }
});

document.getElementById('btnCenter').addEventListener('click', () => {
    setMode('table');
});

document.getElementById('btnExport').addEventListener('click', () => {
    if (!currentData) return;

    if (!window.XLSX) {
        alert('No s\'ha pogut carregar la llibreria d\'Excel.');
        return;
    }

    const pairRows = (currentData.pairs || []).map(p => ({
        Nom_A: p.leftLabel || '',
        PureId_A: p.leftPureId || '',
        Nom_B: p.rightLabel || '',
        PureId_B: p.rightPureId || '',
        Similitud: Math.round((Number(p.value) || 0) * 100) + '%'
    }));

    const clusterRows = [];
    (currentClusters || []).forEach((cluster, index) => {
        (cluster.names || []).forEach((name, memberIndex) => {
            clusterRows.push({
                Cluster: index + 1,
                Mida_Cluster: cluster.size,
                Posicio: memberIndex + 1,
                Nom: name
            });
        });
    });

    const workbook = XLSX.utils.book_new();

    const pairsSheet = XLSX.utils.json_to_sheet(pairRows);
    XLSX.utils.book_append_sheet(workbook, pairsSheet, 'Parelles');

    const clustersSheet = XLSX.utils.json_to_sheet(clusterRows.length ? clusterRows : [{ Info: 'Sense clusters disponibles' }]);
    XLSX.utils.book_append_sheet(workbook, clustersSheet, 'Clusters');

    XLSX.writeFile(workbook, 'similitud-organitzacions-' + new Date().getTime() + '.xlsx');
});

loadGraph();
</script>
</body>
</html>
