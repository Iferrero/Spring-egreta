<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadístiques Organitzacions Externes</title>
    <script src="config.js"></script>
    <script src="uab-brand.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="uab-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- ECharts v4 includes world map files -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

<div class="mx-auto py-10 px-4 max-w-7xl">

    <!-- Header -->
    <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-8">
        <div>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">
                Organitzacions externes <span class="text-blue-600">estadístiques</span>
            </h1>
            <p class="text-slate-500 text-sm mt-1">
                Distribució per tipus d'organització i per país
            </p>
        </div>
        <div class="flex gap-3">
            <a href="organizaciones-externas.html"
               class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-sm text-slate-600 shadow-sm">
                <i class="fa-solid fa-list"></i> Llistat
            </a>
        </div>
    </header>

    <!-- KPI row -->
    <div id="kpiRow" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8"></div>

    <!-- Charts grid -->
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-8">

        <!-- By type -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <h2 class="text-base font-bold text-slate-700 mb-1">
                <i class="fa-solid fa-layer-group text-blue-500 mr-2"></i>Per tipus d'organització
            </h2>
            <p class="text-xs text-slate-400 mb-4">Nombre d'organitzacions per cada tipologia</p>
            <div id="chartType" style="width:100%;height:520px;"></div>
        </div>

        <!-- World map -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
                <h2 class="text-base font-bold text-slate-700">
                    <i class="fa-solid fa-earth-europe text-blue-500 mr-2"></i>Per país
                </h2>
                <span id="filterBadge" class="hidden items-center gap-1.5 bg-blue-50 text-blue-700 border border-blue-200 rounded-full px-3 py-1 text-xs font-semibold">
                    <i class="fa-solid fa-filter"></i>
                    <span id="filterLabel"></span>
                    <button id="clearFilter" class="ml-1 text-blue-400 hover:text-blue-700" title="Treure filtre">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </span>
            </div>
            <p class="text-xs text-slate-400 mb-4">Distribució geogràfica de les organitzacions</p>
            <div id="chartMap" style="width:100%;height:520px;"></div>
        </div>
    </div>

    <!-- Country table (top 20) -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <h2 class="text-sm font-bold text-slate-700">
                <i class="fa-solid fa-flag text-blue-500 mr-2"></i>Top països
            </h2>
            <span id="countryCount" class="text-xs text-slate-400"></span>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                        <th class="px-6 py-3 font-bold w-10">#</th>
                        <th class="px-6 py-3 font-bold">País</th>
                        <th class="px-6 py-3 font-bold text-right">Organitzacions</th>
                        <th class="px-6 py-3 font-bold w-48">Proporció</th>
                    </tr>
                </thead>
                <tbody id="countryTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
// ─────────────────────────────────────────────
// Country name normalization: Pure en_GB → ECharts world map names
// ─────────────────────────────────────────────
const COUNTRY_NAME_MAP = {
    'Russian Federation':              'Russia',
    'United States':                   'United States of America',
    'Korea, Republic of':              'South Korea',
    "Korea, Democratic People's Republic of": 'North Korea',
    'Iran, Islamic Republic of':       'Iran',
    'Syrian Arab Republic':            'Syria',
    'Bolivia, Plurinational State of': 'Bolivia',
    'Moldova, Republic of':            'Moldova',
    'Tanzania, United Republic of':    'Tanzania',
    'Venezuela, Bolivarian Republic of': 'Venezuela',
    'Viet Nam':                        'Vietnam',
    'Lao People\'s Democratic Republic': 'Laos',
    'Congo, The Democratic Republic of the': 'Democratic Republic of the Congo',
    'Congo':                           'Republic of Congo',
    'Côte d\'Ivoire':                  'Ivory Coast',
    'Czech Republic':                  'Czech Republic',
    'Palestine, State of':             'Palestine',
    'Taiwan, Province of China':       'Taiwan',
    'Macao':                           'Macau',
    'Holy See (Vatican City State)':   'Vatican City',
    'Macedonia, the Former Yugoslav Republic of': 'Macedonia',
    'North Macedonia':                 'Macedonia',
    'Micronesia, Federated States of': 'Micronesia',
    'United Kingdom':                  'United Kingdom',
    'Reunion':                         'Réunion',
};

function normalizeCountryName(name) {
    if (!name) return name;
    return COUNTRY_NAME_MAP[name] || name;
}

// ─────────────────────────────────────────────
// Fetch helpers
// ─────────────────────────────────────────────
async function fetchStats(path) {
    const base = (typeof window.API_BASE !== 'undefined') ? window.API_BASE : '/api';
    const res = await fetch(`${base}/external-organizations${path}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
}

// ─────────────────────────────────────────────
// KPI cards
// ─────────────────────────────────────────────
function renderKpis(byType, byCountry) {
    const total = byType.reduce((s, d) => s + d.count, 0);
    const types = byType.length;
    const countries = byCountry.filter(d => d.label !== '(desconegut)').length;
    const topCountry = byCountry.find(d => d.label !== '(desconegut)');

    const cards = [
        { icon: 'fa-building', color: 'blue', label: 'Total', value: total.toLocaleString('ca') },
        { icon: 'fa-layer-group', color: 'violet', label: 'Tipus', value: types },
        { icon: 'fa-earth-europe', color: 'emerald', label: 'Països', value: countries },
        { icon: 'fa-trophy', color: 'amber', label: 'Primer país', value: topCountry ? topCountry.label : '--' },
    ];

    const colors = { blue: ['bg-blue-100', 'text-blue-600'], violet: ['bg-violet-100', 'text-violet-600'],
                     emerald: ['bg-emerald-100', 'text-emerald-600'], amber: ['bg-amber-100', 'text-amber-600'] };

    document.getElementById('kpiRow').innerHTML = cards.map(c => {
        const [bg, fg] = colors[c.color];
        return `
        <div class="bg-white shadow-sm p-4 rounded-xl flex items-center gap-3 border border-slate-200">
            <div class="w-10 h-10 ${bg} rounded-full flex items-center justify-center shrink-0">
                <i class="fa-solid ${c.icon} ${fg}"></i>
            </div>
            <div class="min-w-0">
                <p class="text-xs text-slate-400 uppercase font-bold">${c.label}</p>
                <p class="text-xl font-black text-slate-700 leading-tight truncate" title="${c.value}">${c.value}</p>
            </div>
        </div>`;
    }).join('');
}

// Categorical palette — 20 visually distinct colours
const PALETTE = [
    '#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6',
    '#06b6d4','#f97316','#84cc16','#ec4899','#14b8a6',
    '#6366f1','#eab308','#64748b','#d946ef','#22c55e',
    '#0ea5e9','#fb923c','#a3e635','#f43f5e','#9333ea'
];

// ─────────────────────────────────────────────
// Bar chart — by type
// Returns the chart instance so the caller can attach click handlers.
// ─────────────────────────────────────────────
function renderTypeChart(data, activeType) {
    const el = document.getElementById('chartType');
    const chart = echarts.getInstanceByDom(el) || echarts.init(el);

    // Sort ascending so longest bar is at top
    const sorted = [...data].sort((a, b) => a.count - b.count);
    const labels = sorted.map(d => d.label);
    const values = sorted.map(d => d.count);

    const colors = sorted.map((d, i) => {
        const base = PALETTE[i % PALETTE.length];
        if (!activeType) return base;
        // Dim bars that are not the active type
        return d.label === activeType ? base : '#cbd5e1';
    });

    chart.setOption({
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            formatter: params => {
                const p = params[0];
                return `<b>${p.name}</b><br/>${p.value.toLocaleString('ca')} organitzacions`;
            }
        },
        grid: { left: '2%', right: '8%', top: '2%', bottom: '2%', containLabel: true },
        xAxis: {
            type: 'value',
            axisLabel: { color: '#94a3b8', fontSize: 11 },
            splitLine: { lineStyle: { color: '#f1f5f9' } }
        },
        yAxis: {
            type: 'category',
            data: labels,
            axisLabel: { color: '#475569', fontSize: 11, width: 200, overflow: 'truncate' },
        },
        series: [{
            type: 'bar',
            cursor: 'pointer',
            data: values.map((v, i) => ({
                value: v,
                itemStyle: {
                    color: colors[i],
                    borderRadius: [0, 4, 4, 0],
                    opacity: (!activeType || sorted[i].label === activeType) ? 1 : 0.35
                }
            })),
            label: { show: true, position: 'right', color: '#475569', fontSize: 11,
                     formatter: p => p.value.toLocaleString('ca') }
        }]
    }, true);

    window.addEventListener('resize', () => chart.resize());
    return chart;
}

// ─────────────────────────────────────────────
// World map — by country
// ─────────────────────────────────────────────
function renderMapChart(data) {
    const chart = echarts.init(document.getElementById('chartMap'));

    // Filter out "(desconegut)" and normalize names
    const mapData = data
        .filter(d => d.label && d.label !== '(desconegut)')
        .map(d => ({ name: normalizeCountryName(d.label), value: d.count }));

    const maxCount = Math.max(...mapData.map(d => d.value));

    chart.setOption({
        tooltip: {
            trigger: 'item',
            formatter: p => p.value != null
                ? `<b>${p.name}</b><br/>${Number(p.value).toLocaleString('ca')} organitzacions`
                : `<b>${p.name}</b><br/>Sense dades`
        },
        visualMap: {
            min: 1,
            max: maxCount,
            left: 'left',
            bottom: 20,
            text: [`Màx (${maxCount})`, 'Mín (1)'],
            calculable: true,
            inRange: { color: ['#d1fae5', '#34d399', '#fbbf24', '#f97316', '#dc2626'] },
            textStyle: { color: '#64748b', fontSize: 10 }
        },
        series: [{
            type: 'map',
            map: 'world',
            roam: true,
            emphasis: {
                label: { show: false },
                itemStyle: { areaColor: '#fbbf24', borderColor: '#f59e0b' }
            },
            itemStyle: {
                borderColor: '#e2e8f0',
                borderWidth: 0.5,
                areaColor: '#f1f5f9'
            },
            data: mapData
        }]
    });
    window.addEventListener('resize', () => chart.resize());
}

// ─────────────────────────────────────────────
// Country top table
// ─────────────────────────────────────────────
function renderCountryTable(data) {
    const filtered = data.filter(d => d.label && d.label !== '(desconegut)');
    const total = data.reduce((s, d) => s + d.count, 0);
    const top = filtered.slice(0, 30);

    document.getElementById('countryCount').textContent = `${filtered.length} països`;

    document.getElementById('countryTableBody').innerHTML = top.map((d, i) => {
        const pct = (d.count / total * 100).toFixed(1);
        const barW = Math.round(d.count / filtered[0].count * 100);
        return `
        <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-6 py-3 text-slate-400 font-mono text-xs">${i + 1}</td>
            <td class="px-6 py-3 font-medium text-slate-700">${d.label}</td>
            <td class="px-6 py-3 text-right font-bold text-slate-800">${d.count.toLocaleString('ca')}</td>
            <td class="px-6 py-3">
                <div class="flex items-center gap-2">
                    <div class="flex-1 bg-slate-100 rounded-full h-1.5 overflow-hidden">
                        <div class="h-full bg-blue-500 rounded-full" style="width:${barW}%"></div>
                    </div>
                    <span class="text-xs text-slate-400 w-10 text-right">${pct}%</span>
                </div>
            </td>
        </tr>`;
    }).join('');
}

// ─────────────────────────────────────────────
// Filter badge helpers
// ─────────────────────────────────────────────
function showFilterBadge(type) {
    const badge = document.getElementById('filterBadge');
    document.getElementById('filterLabel').textContent = type;
    badge.classList.remove('hidden');
    badge.classList.add('inline-flex');
}
function hideFilterBadge() {
    const badge = document.getElementById('filterBadge');
    badge.classList.add('hidden');
    badge.classList.remove('inline-flex');
}

// ─────────────────────────────────────────────
// Main
// ─────────────────────────────────────────────
(async () => {
    try {
        const [byType, byCountryAll] = await Promise.all([
            fetchStats('/stats/by-type'),
            fetchStats('/stats/by-country')
        ]);

        renderKpis(byType, byCountryAll);
        const typeChart = renderTypeChart(byType, null);
        renderMapChart(byCountryAll);
        renderCountryTable(byCountryAll);

        let activeType = null;

        // ── Bar click: filter map + table by type ──
        typeChart.on('click', async params => {
            const clicked = params.name;

            if (activeType === clicked) {
                // Second click on same bar → clear filter
                activeType = null;
                hideFilterBadge();
                renderTypeChart(byType, null);
                renderMapChart(byCountryAll);
                renderCountryTable(byCountryAll);
                return;
            }

            activeType = clicked;
            showFilterBadge(clicked);
            renderTypeChart(byType, activeType);

            try {
                const filtered = await fetchStats('/stats/by-country?type=' + encodeURIComponent(clicked));
                renderMapChart(filtered);
                renderCountryTable(filtered);
            } catch (e) {
                console.error('Error filtrant per tipus:', e);
            }
        });

        // ── Clear filter button ──
        document.getElementById('clearFilter').addEventListener('click', () => {
            activeType = null;
            hideFilterBadge();
            renderTypeChart(byType, null);
            renderMapChart(byCountryAll);
            renderCountryTable(byCountryAll);
        });

    } catch (err) {
        document.querySelector('.max-w-7xl').insertAdjacentHTML('afterbegin',
            `<div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 mb-6 text-sm">
                <i class="fa-solid fa-circle-exclamation mr-2"></i>Error carregant les dades: ${err.message}
             </div>`);
    }
})();
</script>
</body>
</html>
